[project]
name = "csci109a-group13"
version = "0.1.0"
description = "Group 13 NSCG data analysis and presentation notebooks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.3,<3",
    "pandas>=3,<4",
    "matplotlib>=3.10,<4",
    "statsmodels>=0.14.5,<0.15",
    "requests>=2.32,<3",
    "openpyxl>=3.1.5,<4",
    "python-pptx>=1.0.2,<2",
    "pillow>=11,<13",
    "ipykernel>=6.29,<8",
    "jupyterlab>=4,<5",
    "nbconvert>=7,<8",
    "nbformat>=5,<6",
]

[tool.uv]
package = false
